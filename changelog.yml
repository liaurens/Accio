      - Added changelog.yml for version tracking
      - Added mkdocs.yml for documentation configuration
    changed:
      - Renamed templates/ to Templates/
      - Moved package from src/tool_wizard/ to +toolwizard/
      - Integrated tests into package structure as +tests/

